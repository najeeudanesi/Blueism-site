<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueism Studio — Brand Identity, Digital & Interior Design</title>
    <meta
      name="description"
      content="Blueism Studio is an independent design studio in Tetouan, Morocco, crafting brand identities, digital experiences, 3D, motion, automation and interior design."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Blueism Studio" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="color-scheme" content="light" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blueism Studio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Blueism Studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@blueismstudio" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Blueism Studio",
        "url": "https://blueismstudio.com",
        "logo": "https://blueismstudio.com/icon-512.png",
        "image": "https://blueismstudio.com/og-image.jpg",
        "email": "support@blueismstudio.com",
        "description": "Independent design studio working across brand identity, digital design, 3D, motion, automation and interior design.",
        "address": { "@type": "PostalAddress", "addressLocality": "Tetouan", "addressCountry": "MA" },
        "areaServed": "Worldwide",
        "sameAs": [
          "https://www.instagram.com/blueismstudio",
          "https://x.com/blueismstudio",
          "https://dribbble.com/blueismstudio",
          "https://www.youtube.com/@blueismstudio"
        ]
      }
    </script>

    <!-- Fallback typeface until licensed Neue Montreal files are added to /public/fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Inter+Tight:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px">
        Blueism Studio — independent design studio in Tetouan, Morocco. Contact: support@blueismstudio.com
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
